# XcodeGen spec. CI runs `xcodegen generate`; the .xcodeproj is not committed.
name: Shrink
options:
  bundleIdPrefix: com.kiddreads
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: "YES"
    INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  Shrink:
    type: application
    platform: iOS
    sources:
      - path: Shrink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kiddreads.shrink
        PRODUCT_NAME: Shrink
        INFOPLIST_KEY_CFBundleDisplayName: Shrink
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Shrink saves the compressed video to your photo library."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ShrinkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ShrinkTests
    dependencies:
      - target: Shrink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kiddreads.shrink.tests
schemes:
  Shrink:
    build: { targets: { Shrink: all, ShrinkTests: [test] } }
    test: { config: Debug, targets: [ShrinkTests] }
    archive: { config: Release }
